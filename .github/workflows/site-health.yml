name: TrueShine published-site health and recovery
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy TrueShine website via GitHub Pages"]
    types: [completed]
permissions:
  actions: write
  contents: read
concurrency:
  group: trueshine-site-health
  cancel-in-progress: true
jobs:
  health:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check published website
        id: check
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="https://satoshii5.github.io/TRUESHINEPREMIUM/"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 8 "$URL" -o /tmp/trueshine.html
          grep -qi "TrueShine" /tmp/trueshine.html
          grep -q 'id="included"' /tmp/trueshine.html
          grep -q 'id="calculator"' /tmp/trueshine.html
          grep -q 'id="leadForm"' /tmp/trueshine.html
          grep -q '291,20' /tmp/trueshine.html
          grep -q '504,40' /tmp/trueshine.html
          grep -q '928,20' /tmp/trueshine.html
          if grep -Eq 'id="(accountOpen|accountFab|accountModal)"' /tmp/trueshine.html; then
            echo "::error::Customer account UI should remain disabled."
            exit 1
          fi
          curl --fail --silent --show-error --location "$URL"crm.html -o /tmp/trueshine-crm.html
          grep -qi 'name="robots" content="noindex,nofollow"' /tmp/trueshine-crm.html
          WORKER_URL="https://trueshine-telegram-leads.manjiros471.workers.dev"
          CRM_STATUS="$(curl --silent --show-error --output /tmp/trueshine-crm-api.json --write-out '%{http_code}' "$WORKER_URL/crm/customers")"
          if [ "$CRM_STATUS" != "401" ]; then
            echo "::error::Unauthenticated CRM endpoint returned HTTP $CRM_STATUS; expected 401."
            cat /tmp/trueshine-crm-api.json
            exit 1
          fi
          echo "Published homepage, service checklist, calculator, lead form, subscription prices, CRM noindex and Worker CRM token gate passed."
      - name: Attempt recovery by re-running Pages deployment
        if: ${{ steps.check.outcome == 'failure' && github.event_name != 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --ref main
          echo "Health check failed. Requested a fresh Pages deployment; source-code failures still require a code fix."
      - name: Fail health run if site is still unhealthy
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Published site health check failed. Inspect the check logs and deployment status; automatic recovery depends on the triggering event."
          exit 1
