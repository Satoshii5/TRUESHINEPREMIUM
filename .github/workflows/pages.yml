name: Deploy TrueShine website via GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node for validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker syntax
        run: |
          cp worker.js worker-check.mjs
          node --check worker-check.mjs
          rm worker-check.mjs
      - name: Run website and CRM regression checks
        run: node scripts/site-check.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test published website
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 "$SITE_URL" -o /tmp/published-site.html
          grep -qi "TrueShine" /tmp/published-site.html
          grep -q 'id="included"' /tmp/published-site.html
          grep -q 'id="calculator"' /tmp/published-site.html
          grep -q 'id="leadForm"' /tmp/published-site.html
          echo "Published site smoke test passed: title, service details, calculator and lead form are present."
